name: Logstash Docker

on:
  push:
    branches:
      - main
    paths:
      - 'logstash/**'
      - '.github/workflows/docker-logstash.yml'
  pull_request:
    paths:
      - 'logstash/**'
      - '.github/workflows/docker-logstash.yml'
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logstash-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_IMAGE: docker.io/j20000105/logstash

jobs:
  upstream:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.versions.outputs.version }}
      plugin_version: ${{ steps.versions.outputs.plugin_version }}
    steps:
    - name: Resolve latest Logstash version
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        token="$(curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 \
          'https://docker-auth.elastic.co/auth?service=token-service&scope=repository:logstash/logstash:pull' \
          | jq -r '.token')"
        version="$(curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 \
          -H "Authorization: Bearer $token" 'https://docker.elastic.co/v2/logstash/logstash/tags/list' \
          | jq -r '.tags[]' \
          | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
          | sort -V \
          | tail -n 1)"
        plugin_version="$(curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 \
          'https://rubygems.org/api/v1/gems/logstash-output-http.json' \
          | jq -r '.version')"
        version_pattern='^[0-9]+(\.[0-9]+){1,3}([A-Za-z0-9._-]+)?$'
        test -n "$version"
        [[ "$plugin_version" =~ $version_pattern ]]
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "plugin_version=$plugin_version" >> "$GITHUB_OUTPUT"
        echo "Using Logstash $version with logstash-output-http $plugin_version" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: upstream
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Build and push
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: logstash
        platforms: ${{ matrix.platform }}
        push: ${{ github.event_name != 'pull_request' }}
        load: ${{ github.event_name == 'pull_request' }}
        pull: true
        build-args: |
          LOGSTASH_VERSION=${{ needs.upstream.outputs.version }}
          LOGSTASH_OUTPUT_HTTP_VERSION=${{ needs.upstream.outputs.plugin_version }}
        tags: ${{ env.REGISTRY_IMAGE }}:staging-${{ matrix.slug }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ needs.upstream.outputs.version }}
        cache-from: type=gha,scope=logstash-${{ matrix.slug }}
        cache-to: type=gha,mode=max,scope=logstash-${{ matrix.slug }}
        provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
        sbom: ${{ github.event_name != 'pull_request' }}
    - name: Smoke test image
      shell: bash
      run: |
        set -euo pipefail
        platform="${{ matrix.platform }}"
        if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
          image="${REGISTRY_IMAGE}:staging-${{ matrix.slug }}"
        else
          image="${REGISTRY_IMAGE}@${{ steps.build.outputs.digest }}"
          docker pull --platform "$platform" "$image"
        fi
        docker run --rm --platform "$platform" \
          --entrypoint /usr/share/logstash/bin/logstash "$image" --version
        docker run --rm --platform "$platform" \
          --entrypoint /usr/share/logstash/bin/logstash-plugin "$image" \
          list --verbose logstash-output-http
        docker run --rm --platform "$platform" \
          --entrypoint /usr/share/logstash/bin/logstash "$image" \
          --config.test_and_exit \
          -e 'input { generator { count => 1 } } output { http { url => "http://127.0.0.1:65535" http_method => "post" } }'

  merge:
    needs: [upstream, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Login to DockerHub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Promote tested image
      shell: bash
      env:
        LOGSTASH_VERSION: ${{ needs.upstream.outputs.version }}
      run: |
        set -euo pipefail
        sources=()
        for slug in amd64 arm64; do
          ref="${REGISTRY_IMAGE}:staging-${slug}"
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref")"
          [[ "$digest" == sha256:* ]]
          sources+=("${REGISTRY_IMAGE}@${digest}")
        done
        docker buildx imagetools create \
          -t "${REGISTRY_IMAGE}:latest" \
          -t "${REGISTRY_IMAGE}:${LOGSTASH_VERSION}" \
          -t "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}" \
          "${sources[@]}"
        docker buildx imagetools inspect "${REGISTRY_IMAGE}:latest"
