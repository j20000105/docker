name: PHP-FPM Docker

on:
  push:
    paths:
      - 'php-fpm/**'
      - '.github/workflows/docker-phpfpm.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-fpm-publish
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: docker.io/j20000105/php-fpm

jobs:
  upstream:
    runs-on: ubuntu-24.04
    outputs:
      ffmpeg_checksums_sha256: ${{ steps.versions.outputs.ffmpeg_checksums_sha256 }}
      redis_version: ${{ steps.versions.outputs.redis_version }}
      imagick_version: ${{ steps.versions.outputs.imagick_version }}
    steps:
    - name: Resolve upstream versions
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        checksums_file="${RUNNER_TEMP}/ffmpeg-checksums.sha256"
        curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 \
          'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/checksums.sha256' \
          -o "$checksums_file"
        grep -Eq '^[a-f0-9]{64}  ffmpeg-master-latest-linux64-gpl-shared\.tar\.xz$' "$checksums_file"
        grep -Eq '^[a-f0-9]{64}  ffmpeg-master-latest-linuxarm64-gpl-shared\.tar\.xz$' "$checksums_file"
        ffmpeg_checksums_sha256="$(sha256sum "$checksums_file" | awk '{print $1}')"
        redis_version="$(curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 \
          'https://pecl.php.net/rest/r/redis/latest.txt')"
        imagick_version="$(curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 \
          'https://pecl.php.net/rest/r/imagick/latest.txt')"
        version_pattern='^[0-9]+(\.[0-9]+){1,3}([A-Za-z0-9._-]+)?$'
        [[ "$redis_version" =~ $version_pattern ]]
        [[ "$imagick_version" =~ $version_pattern ]]
        {
          echo "ffmpeg_checksums_sha256=$ffmpeg_checksums_sha256"
          echo "redis_version=$redis_version"
          echo "imagick_version=$imagick_version"
        } >> "$GITHUB_OUTPUT"
        {
          echo '### PHP upstream versions'
          echo
          echo "- FFmpeg checksums: \`$ffmpeg_checksums_sha256\`"
          echo "- Redis: \`$redis_version\`"
          echo "- Imagick: \`$imagick_version\`"
        } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: upstream
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Login to DockerHub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Build and push
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: php-fpm
        platforms: ${{ matrix.platform }}
        push: true
        pull: true
        build-args: |
          FFMPEG_CHECKSUMS_SHA256=${{ needs.upstream.outputs.ffmpeg_checksums_sha256 }}
          REDIS_VERSION=${{ needs.upstream.outputs.redis_version }}
          IMAGICK_VERSION=${{ needs.upstream.outputs.imagick_version }}
        tags: ${{ env.REGISTRY_IMAGE }}:staging-${{ matrix.slug }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=php-fpm-${{ matrix.slug }}
        cache-to: type=gha,mode=max,scope=php-fpm-${{ matrix.slug }}
        provenance: mode=max
        sbom: true
    - name: Smoke test image
      shell: bash
      run: |
        set -euo pipefail
        image="${REGISTRY_IMAGE}@${{ steps.build.outputs.digest }}"
        platform="${{ matrix.platform }}"
        docker pull --platform "$platform" "$image"
        docker run --rm --platform "$platform" "$image" php --version
        docker run --rm --platform "$platform" "$image" php-fpm -tt
        docker run --rm --platform "$platform" "$image" composer --version
        docker run --rm --platform "$platform" "$image" ffmpeg -version
        docker run --rm --platform "$platform" "$image" ffprobe -version
        docker run --rm --platform "$platform" "$image" php -r '
          $required = ["gd", "imagick", "pcntl", "pdo", "pdo_mysql", "redis", "zip"];
          foreach ($required as $extension) {
              if (!extension_loaded($extension)) {
                  fwrite(STDERR, "Missing extension: $extension\n");
                  exit(1);
              }
          }
        '

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Login to DockerHub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Create manifest list and push
      shell: bash
      run: |
        set -euo pipefail
        sources=()
        for slug in amd64 arm64; do
          ref="${REGISTRY_IMAGE}:staging-${slug}"
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref")"
          [[ "$digest" == sha256:* ]]
          sources+=("${REGISTRY_IMAGE}@${digest}")
        done
        docker buildx imagetools create \
          -t "${REGISTRY_IMAGE}:latest" \
          -t "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}" \
          -t "${REGISTRY_IMAGE}:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          "${sources[@]}"
        docker buildx imagetools inspect "${REGISTRY_IMAGE}:latest"
