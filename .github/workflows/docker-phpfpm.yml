name: PHP-FPM Docker

on:
  push:
    paths:
      - 'php-fpm/**'
  schedule:
    - cron:  '0 0 * * 0,3'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
          - platform: linux/arm64
            slug: arm64
    steps:
    - uses: actions/checkout@v4
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: php-fpm
        platforms: ${{ matrix.platform }}
        push: true
        tags: j20000105/php-fpm:latest-${{ matrix.slug }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Create manifest list and push
      run: |
        docker buildx imagetools create -t j20000105/php-fpm:latest \
          j20000105/php-fpm:latest-amd64 \
          j20000105/php-fpm:latest-arm64
